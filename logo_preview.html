<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>High Class Logo Preview</title>
<style>
  body {
    background: #08120c;
    color: #ffffff;
    font-family: Inter, sans-serif;
    padding: 60px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }
  .grid {
    display: flex;
    gap: 32px;
  }
  .card {
    background: rgba(12, 22, 16, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 220px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #a7f3d0;
  }
  .preview-nav {
    background: rgba(10, 20, 14, 0.82);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <h1>Demandra High-Class Logo Explorations</h1>
  <div class="grid">
    <!-- Option 1: The Faceted Neural Nexus -->
    <div class="card">
      <div class="card-title">1. FACETED NEURAL NEXUS</div>
      <!-- Large (64px) -->
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="opt1_a" x1="8" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop stop-color="#34D399"/>
            <stop offset="1" stop-color="#059669"/>
          </linearGradient>
          <linearGradient id="opt1_b" x1="24" y1="8" x2="40" y2="24" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A7F3D0"/>
            <stop offset="1" stop-color="#10B981"/>
          </linearGradient>
          <linearGradient id="opt1_c" x1="16" y1="24" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#10B981"/>
            <stop offset="1" stop-color="#064E3B"/>
          </linearGradient>
          <linearGradient id="opt1_d" x1="8" y1="24" x2="24" y2="40" gradientUnits="userSpaceOnUse">
            <stop stop-color="#064E3B"/>
            <stop offset="1" stop-color="#022C22"/>
          </linearGradient>
          <filter id="opt1_glow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.35"/>
          </filter>
        </defs>
        <g filter="url(#opt1_glow)">
          <!-- Top Left Blade -->
          <path d="M24 6L11 18.5L24 24L24 6Z" fill="url(#opt1_a)"/>
          <!-- Top Right Blade -->
          <path d="M24 6L37 18.5L24 24L24 6Z" fill="url(#opt1_b)"/>
          <!-- Bottom Right Blade -->
          <path d="M24 24L37 18.5L28 39L24 24Z" fill="url(#opt1_c)"/>
          <!-- Bottom Left Blade (Forms continuous flow D/Nexus) -->
          <path d="M24 24L28 39L16 42L11 18.5L24 24Z" fill="url(#opt1_d)"/>
          <!-- Precision Core Node -->
          <circle cx="24" cy="24" r="2.5" fill="#FFFFFF"/>
          <path d="M20 24H28M24 20V28" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </svg>

      <!-- Nav Size (38px) -->
      <div class="preview-nav">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6L11 18.5L24 24L24 6Z" fill="url(#opt1_a)"/>
          <path d="M24 6L37 18.5L24 24L24 6Z" fill="url(#opt1_b)"/>
          <path d="M24 24L37 18.5L28 39L24 24Z" fill="url(#opt1_c)"/>
          <path d="M24 24L28 39L16 42L11 18.5L24 24Z" fill="url(#opt1_d)"/>
          <circle cx="24" cy="24" r="2.5" fill="#FFFFFF"/>
        </svg>
        <span style="font-size: 14px; font-weight: 500; color: #fff;">Planning</span>
      </div>
    </div>

    <!-- Option 2: The Continuous Möbius Delta (Precision Enterprise Flow) -->

        <defs>
          <linearGradient id="opt2_ribbon1" x1="6" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
            <stop stop-color="#34D399"/>
            <stop offset="0.5" stop-color="#10B981"/>
            <stop offset="1" stop-color="#064E3B"/>
          </linearGradient>
          <linearGradient id="opt2_ribbon2" x1="42" y1="14" x2="12" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A7F3D0"/>
            <stop offset="0.6" stop-color="#34D399"/>
            <stop offset="1" stop-color="#059669"/>
          </linearGradient>
          <linearGradient id="opt2_core" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#6EE7B7"/>
          </linearGradient>
          <filter id="opt2_glow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#34D399" flood-opacity="0.3"/>
          </filter>
        </defs>
        <g filter="url(#opt2_glow)">
          <!-- Outer dynamic infinity / delta curve -->
          <path d="M12 14C12 9.5 16.5 6 22 6C31 6 38 13 38 22C38 31 31 38 22 38C15 38 10 33 10 26C10 20 15 15 21 15C27 15 32 19 32 25" stroke="url(#opt2_ribbon1)" stroke-width="4.2" stroke-linecap="round"/>
          <path d="M21 15L32 25L40 18" stroke="url(#opt2_ribbon2)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="21" cy="15" r="2.8" fill="url(#opt2_core)"/>
        </g>
      </svg>

      <!-- Nav Size (38px) -->
      <div class="preview-nav">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14C12 9.5 16.5 6 22 6C31 6 38 13 38 22C38 31 31 38 22 38C15 38 10 33 10 26C10 20 15 15 21 15C27 15 32 19 32 25" stroke="url(#opt2_ribbon1)" stroke-width="4.2" stroke-linecap="round"/>
          <path d="M21 15L32 25L40 18" stroke="url(#opt2_ribbon2)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="21" cy="15" r="2.8" fill="url(#opt2_core)"/>
        </svg>
        <span style="font-size: 14px; font-weight: 500; color: #fff;">Planning</span>
      </div>
    </div>

        </defs>
        <g filter="url(#opt3_shadow)">

          <polygon points="24,5 37,13 24,24 11,13" fill="url(#opt3_f1)"/>

          <polygon points="24,24 28,38 24,43 14,35" fill="url(#opt3_f3)"/>
          <polygon points="11,13 24,24 14,35 7,27" fill="url(#opt3_f4)"/>
          <!-- Razor fine chamfer lines -->
          <line x1="24" y1="5" x2="24" y2="24" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
          <line x1="11" y1="13" x2="37" y2="13" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>
          <circle cx="24" cy="24" r="2.2" fill="#FFFFFF"/>
        </g>
      </svg>

      <!-- Nav Size (38px) -->
      <div class="preview-nav">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="24,5 37,13 24,24 11,13" fill="url(#opt3_f1)"/>
          <polygon points="37,13 41,27 28,38 24,24" fill="url(#opt3_f2)"/>
          <polygon points="24,24 28,38 24,43 14,35" fill="url(#opt3_f3)"/>
          <polygon points="11,13 24,24 14,35 7,27" fill="url(#opt3_f4)"/>
          <circle cx="24" cy="24" r="2.2" fill="#FFFFFF"/>
        </svg>
        <span style="font-size: 14px; font-weight: 500; color: #fff;">Planning</span>
      </div>
    </div>

    <!-- Option 4: The Monolithic Monogram Nexus (Linear / Stripe / Anthropic Level) -->
    <div class="card">
      <div class="card-title">4. MONOLITHIC NEXUS</div>
      <!-- Large (64px) -->
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="opt4_g1" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38EF7D"/>
            <stop offset="0.45" stop-color="#10B981"/>

          <filter id="opt4_glow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38EF7D" flood-opacity="0.38"/>
          </filter>
        </defs>
        <g filter="url(#opt4_glow)">
          <!-- Pure standalone geometric sculpture (No box, pure monolithic precision) -->
          <!-- Forward velocity chevron interlocking with parabolic demand curve -->
          <path d="M10 8H24C32.8 8 39 14.8 39 24C39 33.2 32.8 40 24 40H10" stroke="url(#opt4_g1)" stroke-width="4.5" stroke-linecap="round"/>

          <circle cx="28" cy="24" r="2.2" fill="#38EF7D"/>

      </svg>

      <div class="card-title">5. QUANTUM NEXUS PRISM</div>

        <defs>

      <!-- Nav Size (38px) -->

  </div>
</body>
